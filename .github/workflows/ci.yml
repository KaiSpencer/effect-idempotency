name: ci

on:
  pull_request:
  # The release job dispatches this for the version pull request.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-bun can only install the moving `canary` tag. npm keeps every
      # canary as an immutable version, so the build pinned in package.json
      # (`packageManager`) comes from there.
      - name: Install the pinned Bun
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build
      - run: bun pm pack --dry-run

  # A pull request does not count a dispatched run's check, and main requires
  # `check`. Report the dispatched result as a commit status of that name,
  # which a pull request does count.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state="$STATE" -f context=check
          -f description="ci.yml, dispatched run"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.check.result == 'success' && 'success' || 'failure' }}
