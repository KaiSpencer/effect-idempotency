name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'KaiSpencer/effect-idempotency'
    # npm Trusted Publishing only accepts tokens from GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `npm` environment only deploys from main. Name it in the package's
    # trusted publisher on npm, so a run outside it cannot stage a release.
    environment: npm
    permissions:
      contents: write # the version commit, the tag, the GitHub release
      pull-requests: write # the "Version Packages" pull request
      actions: write # dispatch ci.yml for the version pull request
      id-token: write # npm Trusted Publishing (OIDC), no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # npm stages the release (`bun publish` has no OIDC and no staged
      # publishing) and installs Bun.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      # setup-bun can only install the moving `canary` tag. npm keeps every
      # canary as an immutable version, so the build pinned in package.json
      # (`packageManager`) comes from there.
      - name: Install the pinned Bun
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          # scripts/release.ts creates the release and its tag itself.
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
      # GitHub holds the pull_request runs of a pull request opened with
      # GITHUB_TOKEN until a maintainer approves them. A dispatched run needs
      # no approval, and its checks land on the same commit.
      - if: steps.changesets.outputs.has-changesets == 'true'
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
