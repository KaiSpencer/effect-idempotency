name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # `bun lint` ships in Bun 1.4.6, which is not released yet. Until it
          # is, this job runs on canary; then switch to
          # `bun-version-file: package.json` like the release job.
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build
      - run: bun pm pack --dry-run
