name: ci

on:
  pull_request:
  # The release job dispatches this for the version pull request.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-bun can only install the moving `canary` tag. npm keeps every
      # canary as an immutable version, so the build pinned in package.json
      # (`packageManager`) comes from there.
      - name: Install the pinned Bun
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run build
      - run: bun pm pack --dry-run
