name: ci

on:
  pull_request:
  # The release job dispatches this for the version pull request.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The SQL store is tested against a real server as well as the databases
    # that run inside `bun test`: only a server runs statements at the same
    # time. With `CI` set, the tests fail if the URL below is missing, so
    # they cannot be left out unnoticed. The image is pinned like the actions.
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-bun can only install the moving `canary` tag. npm keeps every
      # canary as an immutable version, so the build pinned in package.json
      # (`packageManager`) comes from there.
      - name: Install the pinned Bun
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: bun install --frozen-lockfile
      # The lint covers the documentation site too, whose files need its
      # packages to be type checked. `verify` installs them, but not frozen.
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run verify
      - run: bun run build
      - run: bun pm pack --dry-run

  # Builds the documentation site. The build compiles every example on it
  # against `src/`, so a change that breaks an example fails here.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Bun
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      # The examples resolve `effect` from the root, so both are installed.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run check
        working-directory: docs
      - run: bun run build
        working-directory: docs

  # A pull request does not count a dispatched run's check, and main requires
  # `check`. Report the dispatched result as a commit status of that name,
  # which a pull request does count.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state="$STATE" -f context=check
          -f description="ci.yml, dispatched run"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.check.result == 'success' && 'success' || 'failure' }}
